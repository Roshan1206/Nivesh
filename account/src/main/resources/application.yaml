server:
  port: 8083

nivesh:
  auth:
    url: http://localhost:8081
  account:
    database:
      schema: account

spring:
  application:
    name: account
  datasource:
    url: jdbc:postgresql://localhost:5432/nivesh?currentSchema=${nivesh.account.database.schema}
    username: postgres
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: ${nivesh.account.database.schema}
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: ${nivesh.account.database.schema}
    location: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging:
  level:
    org.springframework.security: TRACE
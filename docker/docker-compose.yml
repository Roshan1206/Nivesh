services:
  redis:
    image: redis:8.8.0
    container_name: redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    depends_on:
      - redis
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    depends_on:
      - kafka
    ports:
      - "8079:8083"        # host:container — Debezium always listens on 8083 internally
    environment:
      BOOTSTRAP_SERVERS: kafka:29092          # internal Docker network listener
      GROUP_ID: debezium-connect-cluster
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  config:
    image: roshan96/nvsh-config:1.0
    container_name: config
    ports:
      - "8888:8081"

  eureka:
    image: roshan96/nvsh-eureka:1.0
    container_name: eureka
    depends_on:
      config:
        condition: service_started
    ports:
      - "8761:8081"

  auth:
    image: roshan96/nvsh-auth:1.0
    container_name: auth
    depends_on:
      redis:
        condition: service_started
      eureka:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
    ports:
      - "8081:8081"

  customer:
    image: roshan96/nvsh-customer:1.0
    container_name: customer
    depends_on:
      auth:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
    ports:
      - "8082:8081"

  account:
    image: roshan96/nvsh-account:1.0
    container_name: account
    depends_on:
      customer:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
    ports:
      - "8083:8081"

  transaction:
    image: roshan96/nvsh-transaction:1.0
    container_name: transaction
    depends_on:
      account:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
    ports:
      - "8084:8081"

  gateway:
    image: roshan96/nvsh-gateway:1.0
    container_name: gateway
    depends_on:
      account:
        condition: service_started
    ports:
      - "8080:8081"

networks:
  nivesh:
    driver: "bridge"
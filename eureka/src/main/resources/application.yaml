server:
  port: 8761

spring:
  application:
    name: eureka
  config:
    import: "optional:configserver:${CONFIG_SERVER:http://localhost:8888}"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

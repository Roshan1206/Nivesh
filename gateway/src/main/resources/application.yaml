server:
  port: 8080

nivesh.auth.url: ${AUTH_URL:http://localhost:8081}

spring:
  application:
    name: gateway
  webflux:
    base-path: /nivesh
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  security:
    user:
      name: nivesh
      password: password
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
          default-filters:
            - RewritePath=/nivesh/(?<segment>.*), /${segment}
          routes:
            - id: auth-service
              uri: lb://AUTHENTICATION
              predicates:
                - Path=/auth/**,/user/**
            - id: account-service
              uri: lb://ACCOUNT
              predicates:
                - Path=/accounts/**
            - id: customer-service
              uri: lb://CUSTOMER
              predicates:
                - Path=/customers/**,/kyc/**
            - id: transaction-service
              uri: lb://TRANSACTION
              predicates:
                - Path=/transactions/**
eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

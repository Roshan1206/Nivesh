info:
  name: Transaction initiate
  type: http
  seq: 1

http:
  method: POST
  url: "{{transaction}}/transactions"
  headers:
    - name: idempotencyKey
      value: "000001014"
  body:
    type: json
    data: |-
      {
        "sourceAccountNumber": "10000000025",
        "destinationAccountNumber": "10000000017",
        "amount": 500.00,
        "message": "first"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.7.2
    container_name: alloy
    depends_on:
      - loki
    ports:
      - "12345:12345"
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  postgres:
    image: postgis/postgis:17-3.5
    container_name: postgres
    environment:
      POSTGRES_USER: niveshbank
      POSTGRES_PASSWORD: niveshbank
      POSTGRES_DB: niveshbank
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U niveshbank -d niveshbank" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    container_name: redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    depends_on:
      - kafka
    ports:
      - "8079:8083"        # host:container — Debezium always listens on 8083 internally
    environment:
      BOOTSTRAP_SERVERS: kafka:29092          # internal Docker network listener
      GROUP_ID: debezium-connect-cluster
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  config:
    image: roshan96/nvsh-config:1.0
    container_name: config
    depends_on:
      - grafana
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka:
    image: roshan96/nvsh-eureka:1.0
    container_name: eureka
    depends_on:
      config:
        condition: service_healthy
    environment:
      NIVESH_CONFIG_SERVER: http://config:8888
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    image: roshan96/nvsh-auth:1.0
    container_name: auth
    depends_on:
      redis:
        condition: service_started
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
      REDIS_HOST: redis
      CONFIG_SERVER: http://config:8888
      EUREKA_SERVER: http://eureka:8761
      AUTH_URL: http://auth:8081
      EUREKA_INSTANCE_HOSTNAME: auth
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  customer:
    image: roshan96/nvsh-customer:1.0
    container_name: customer
    depends_on:
      auth:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
      REDIS_HOST: redis
      CONFIG_SERVER: http://config:8888
      EUREKA_SERVER: http://eureka:8761
      AUTH_URL: http://auth:8081
      EUREKA_INSTANCE_HOSTNAME: CUSTOMER
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  account:
    image: roshan96/nvsh-account:1.0
    container_name: account
    depends_on:
      customer:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER: http://config:8888
      EUREKA_SERVER: http://eureka:8761
      AUTH_URL: http://auth:8081
      EUREKA_INSTANCE_HOSTNAME: ACCOUNT
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  transaction:
    image: roshan96/nvsh-transaction:1.0
    container_name: transaction
    depends_on:
      account:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/niveshbank
      DB_USERNAME: niveshbank
      DB_PASSWORD: niveshbank
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER: http://config:8888
      EUREKA_SERVER: http://eureka:8761
      AUTH_URL: http://auth:8081
      ACCOUNT_URL: http://account:8083
      EUREKA_INSTANCE_HOSTNAME: TRANSACTION
    ports:
      - "8084:8084"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: roshan96/nvsh-gateway:1.0
    container_name: gateway
    depends_on:
      transaction:
        condition: service_healthy
    environment:
      CONFIG_SERVER: http://config:8888
      EUREKA_SERVER: http://eureka:8761
      AUTH_URL: http://auth:8081
      EUREKA_INSTANCE_HOSTNAME: GATEWAY
    ports:
      - "8080:8080"

networks:
  nivesh:
    driver: "bridge"

volumes:
  loki-data:
  grafana-data:
  pgdata:

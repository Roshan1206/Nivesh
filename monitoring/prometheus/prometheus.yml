global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'config'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'config:8888' ]
        labels:
          service: 'config'

  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'eureka:8761' ]
        labels:
          service: 'eureka'

  - job_name: 'auth'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth:8081']
        labels:
          service: 'auth'

  - job_name: 'customer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer:8082']
        labels:
          service: 'customer'

  - job_name: 'account'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'account:8083' ]
        labels:
          service: 'account'

  - job_name: 'transaction'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'transaction:8084' ]
        labels:
          service: 'account'

  - job_name: 'gateway'
    metrics_path: '/nivesh/actuator/prometheus'
    static_configs:
      - targets: [ 'gateway:8080' ]
        labels:
          service: 'gateway'
server:
  port: 8084

nivesh:
  auth:
    url: http://localhost:8081
  account:
    url: http://localhost:8083
  transaction:
    database:
      schema: txn

spring:
  application:
    name: transaction
  datasource:
    url: jdbc:postgresql://localhost:5432/nivesh?currentSchema=${nivesh.transaction.database.schema}
    username: postgres
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: ${nivesh.transaction.database.schema}
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: ${nivesh.transaction.database.schema}
    location: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  mail:
    host: smtp.ethereal.email
    port: 587
    username: ${MAIL_ID:bonnie33@ethereal.email}
    password: ${MAIL_PWD:VdEK8XvVHqgYRS9CwG}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8084

nivesh:
  kafka.enabled: true
  auth.url: ${AUTH_URL:http://localhost:8081}
  account.url: ${ACCOUNT_URL:http://localhost:8083}
  transaction.database.schema: txn

spring:
  application:
    name: transaction
  datasource:
    url: jdbc:postgresql://localhost:5432/nivesh?currentSchema=${nivesh.transaction.database.schema}
    username: postgres
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: ${nivesh.transaction.database.schema}
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: ${nivesh.transaction.database.schema}
    location: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  mail:
    host: smtp.ethereal.email
    port: 587
    username: ${MAIL_ID:bonnie33@ethereal.email}
    password: ${MAIL_PWD:VdEK8XvVHqgYRS9CwG}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST:localhost}
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: transaction-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json:
          trusted.packages: "com.nivesh.library.event"
          add.type.headers: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.nivesh.library.service.OtpCacheService: TRACE
